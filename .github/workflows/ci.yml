name: CI

on:
  pull_request:
  push:
    branches: [v2]
  # Deploys v2 whatever changed, e.g. after a secret or variable changes.
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
            ~/.cache/ms-playwright
            ~/.cache/ms-playwright-go
          # headless: caches from before hold full Chromium too, which restoring
          # them would download for nothing.
          key: go-headless-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: go-headless-${{ runner.os }}-
      # The browser tests' Chromium, at the version go.mod's playwright-go drives: only
      # its headless shell, which they launch, and without --with-deps, since the runner
      # image ships Chrome's system libraries. CI sets CI=true, so a missing browser
      # fails them instead of skipping them. A stalled download fails in minutes.
      - name: Install Chromium
        timeout-minutes: 3
        run: go run github.com/mxschmitt/playwright-go/cmd/playwright install --only-shell chromium
      - name: Generate templ code
        run: mise run generate
      - name: Generated code is committed
        run: git diff --exit-code
      - name: Check
        run: mise run check
      # go test hides a skip behind "ok": show the browser tests passed in
      # Chromium, and fail if none did.
      - name: Browser tests ran
        run: |
          set -o pipefail
          go test -count=1 -v -run '^TestBrowser' ./internal/app | tee browser.log
          grep -q -- '--- PASS: TestBrowser' browser.log

  # Whether a push to v2 changes what a deploy ships: the image's sources as
  # .dockerignore lets them in (tests aside), the server's files in deploy/, or this
  # workflow. Docs alone deploy nothing. A push whose base isn't in the history, such
  # as a force push, deploys, as does a run started by hand.
  changes:
    if: github.ref == 'refs/heads/v2' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.diff.outputs.deploy }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          deploy=true
          if [ "$GITHUB_EVENT_NAME" = push ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            git diff --name-only "$BEFORE" "$GITHUB_SHA" | tee changed.txt
            grep -v '_test\.go$' changed.txt > shipped.txt || true
            grep -Eq '^(go\.(mod|sum)|Dockerfile|\.dockerignore|cmd/|internal/|deploy/|\.github/workflows/ci\.yml$)' shipped.txt ||
              deploy=false
          fi
          echo "deploy=$deploy" | tee -a "$GITHUB_OUTPUT"

  # A merge to v2 that changes what runs deploys once every check passes (ADR-0017):
  # the image goes to GHCR, and the VPS pulls it. The app migrates its database on
  # start, and the deploy fails unless it comes up healthy.
  deploy:
    if: needs.changes.outputs.deploy == 'true'
    needs: [check, changes]
    runs-on: ubuntu-latest
    concurrency:
      group: deploy
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}:${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}
            ghcr.io/${{ github.repository }}:v2
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: SSH to the server
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519
      - name: Deploy
        env:
          HOST: deploy@${{ secrets.DEPLOY_HOST }}
          DANDORI_DOMAIN: ${{ vars.DANDORI_DOMAIN }}
          DANDORI_DATABASE_URL: ${{ secrets.DANDORI_DATABASE_URL }}
          DANDORI_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          DANDORI_SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          scp deploy/compose.yaml deploy/Caddyfile "$HOST:/srv/dandori/"
          printf "DANDORI_IMAGE='%s'\nDANDORI_DOMAIN='%s'\nDANDORI_DATABASE_URL='%s'\nDANDORI_SUPABASE_URL='%s'\nDANDORI_SUPABASE_PUBLISHABLE_KEY='%s'\n" \
            "$IMAGE" "$DANDORI_DOMAIN" "$DANDORI_DATABASE_URL" "$DANDORI_SUPABASE_URL" "$DANDORI_SUPABASE_PUBLISHABLE_KEY" \
            | ssh "$HOST" 'umask 077 && cat > /srv/dandori/.env'
          printf '%s' "$GHCR_TOKEN" | ssh "$HOST" "docker login ghcr.io -u '${{ github.actor }}' --password-stdin"
          ssh "$HOST" 'cd /srv/dandori && docker compose pull && docker compose up -d --wait --wait-timeout 120 --remove-orphans'
          ssh "$HOST" 'docker logout ghcr.io; docker image prune -af'
      - name: The page is served over TLS
        run: curl -fsS --retry 10 --retry-delay 6 --retry-all-errors "https://${{ vars.DANDORI_DOMAIN }}/healthz"
