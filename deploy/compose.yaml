# Dandori on the VPS (ADR-0017): the app behind Caddy, which gets and
# renews the TLS certificate. CI copies this file and the Caddyfile to
# /srv/dandori and writes the .env next to them with DANDORI_IMAGE,
# DANDORI_DOMAIN, DANDORI_DATABASE_URL, the Supabase project's URL and
# publishable key, Grafana Cloud's OTLP endpoint and token, the Claude API
# key, the model (empty for the app's default) and the Faro collector's URL
# (empty for no browser telemetry) on every deploy.
services:
  app:
    image: ${DANDORI_IMAGE:?}
    restart: unless-stopped
    environment:
      DANDORI_DATABASE_URL: ${DANDORI_DATABASE_URL:?}
      DANDORI_SUPABASE_URL: ${DANDORI_SUPABASE_URL:?}
      DANDORI_SUPABASE_PUBLISHABLE_KEY: ${DANDORI_SUPABASE_PUBLISHABLE_KEY:?}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:?}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:?}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?}
      DANDORI_MODEL: ${DANDORI_MODEL:-}
      DANDORI_FARO_URL: ${DANDORI_FARO_URL:-}
      # Tells production's spans and logs from those of `mise run dev`, tagged dev.
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment.name=prod

  caddy:
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DANDORI_DOMAIN: ${DANDORI_DOMAIN:?}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
