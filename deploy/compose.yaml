# Dandori on the VPS (ADR-0017): the app behind Caddy, which gets and
# renews the TLS certificate. CI copies this file and the Caddyfile to
# /srv/dandori and writes the .env next to them with DANDORI_IMAGE,
# DANDORI_DOMAIN and DANDORI_DATABASE_URL on every deploy.
services:
  app:
    image: ${DANDORI_IMAGE:?}
    restart: unless-stopped
    environment:
      DANDORI_DATABASE_URL: ${DANDORI_DATABASE_URL:?}

  caddy:
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DANDORI_DOMAIN: ${DANDORI_DOMAIN:?}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
