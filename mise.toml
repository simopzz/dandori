[tools]
go = "1.27.3"
"go:github.com/a-h/templ/cmd/templ" = "0.3.1070"

[env]
# Admin connection to a disposable Postgres + pgvector server; seam-1 tests
# create one database per test on it. Start it with `mise run testdb`.
MEALOPS_TEST_DATABASE_URL = "postgres://postgres:postgres@127.0.0.1:5433/postgres?sslmode=disable"

[tasks.generate]
description = "Generate Go code from templ templates"
run = "templ generate"

[tasks.build]
description = "Build the single mealops binary"
depends = ["generate"]
run = "go build -o bin/mealops ./cmd/mealops"

[tasks.test]
description = "Run the full test suite (needs the test database)"
depends = ["generate"]
run = "go test ./..."

[tasks.testdb]
description = "Start the disposable Postgres + pgvector test server (docker needs sudo)"
run = "sudo docker run -d --rm --name mealops-testdb -e POSTGRES_PASSWORD=postgres -p 127.0.0.1:5433:5432 pgvector/pgvector:pg17"

[tasks.dev]
description = "Run the app locally against MEALOPS_DATABASE_URL"
depends = ["generate"]
run = "go run ./cmd/mealops serve"
