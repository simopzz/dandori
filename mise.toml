[tools]
go = "1.27.3"
"go:github.com/a-h/templ/cmd/templ" = "0.3.1070"
golangci-lint = "2.15.0"

# mise install turns on the repo's git hooks: the pre-commit hook runs mise run guardrails.
[hooks]
postinstall = "git config core.hooksPath .githooks"

[env]
# Local secrets such as DANDORI_DATABASE_URL; see .env.example.
_.file = ".env"
# Admin connection to a disposable Postgres + pgvector server; seam-1 tests
# create one database per test on it. Start it with `mise run testdb`.
DANDORI_TEST_DATABASE_URL = "postgres://postgres:postgres@127.0.0.1:5433/postgres?sslmode=disable"

[tasks.generate]
description = "Generate Go code from templ templates"
run = "templ generate"

[tasks.build]
description = "Build the single dandori binary"
depends = ["generate"]
run = "go build -o bin/dandori ./cmd/dandori"

[tasks.test]
description = "Run the full test suite (needs the test database)"
depends = ["generate"]
run = "go test ./..."

[tasks.testdb]
description = "Start the disposable Postgres + pgvector test server (docker needs sudo)"
run = "sudo docker run -d --rm --name dandori-testdb -e POSTGRES_PASSWORD=postgres -p 127.0.0.1:5433:5432 pgvector/pgvector:pg17"

[tasks.browsers]
description = "Install the Chromium the browser tests drive (CI adds --with-deps for its system libraries)"
run = "go run github.com/mxschmitt/playwright-go/cmd/playwright install chromium"

[tasks.check]
description = "Run every check CI runs: gofmt, go vet, golangci-lint and the full test suite"
depends = ["generate"]
run = [
  'unformatted=$(gofmt -l .); if [ -n "$unformatted" ]; then echo "gofmt needed:"; echo "$unformatted"; exit 1; fi',
  "go vet ./...",
  "golangci-lint run ./...",
  "go test -count=1 ./...",
]

[tasks.guardrails]
description = "Run the checks that need no database, in seconds: gofmt, templ output up to date, go vet, golangci-lint and the guardrail tests"
depends = ["generate"]
run = [
  'unformatted=$(gofmt -l .); if [ -n "$unformatted" ]; then echo "gofmt needed:"; echo "$unformatted"; exit 1; fi',
  'git diff --quiet -- "*_templ.go" || { echo "templ output changed: add the *_templ.go files"; git diff --stat -- "*_templ.go"; exit 1; }',
  "go vet ./...",
  "golangci-lint run ./...",
  "go test -count=1 ./internal/web ./internal/clock ./internal/kitchen ./cmd/dandori",
]

[tasks.devdb]
description = "Start the local Postgres + pgvector dev server, which keeps its data between runs (docker needs sudo)"
# pg_isready over TCP: while the image initialises its first database, its
# temporary server listens only on the socket.
run = '''
sudo docker start dandori-devdb >/dev/null 2>&1 || sudo docker run -d --name dandori-devdb \
  -v dandori-devdb:/var/lib/postgresql/data -e POSTGRES_PASSWORD=postgres \
  -p 127.0.0.1:5434:5432 pgvector/pgvector:pg17 >/dev/null
until sudo docker exec dandori-devdb pg_isready -q -h 127.0.0.1; do sleep 0.5; done
'''

[tasks.dev]
description = "Run the app locally against the dev server and the real Supabase Auth"
# The dev server, never DANDORI_DATABASE_URL: a branch's migrations must not
# reach production. Supabase's URL and key come from .env under either name,
# DANDORI_ as in .env.example or bare as provision.sh writes them. Spans and logs go to
# Grafana Cloud if .env sets its endpoint, tagged dev to tell them from production's.
# Runs ask the scripted model, which costs nothing.
env = { DANDORI_SCRIPTED_MODEL = "true", OTEL_RESOURCE_ATTRIBUTES = "deployment.environment.name=dev", DANDORI_DATABASE_URL = "postgres://postgres:postgres@127.0.0.1:5434/postgres?sslmode=disable", DANDORI_SUPABASE_URL = "{{ env.DANDORI_SUPABASE_URL | default(value=env | get(key='SUPABASE_URL', default='')) }}", DANDORI_SUPABASE_PUBLISHABLE_KEY = "{{ env.DANDORI_SUPABASE_PUBLISHABLE_KEY | default(value=env | get(key='SUPABASE_PUBLISHABLE_KEY', default='')) }}" }
# devdb first, alone: as dependencies the two would run in parallel, and
# generate's output would land on sudo's password prompt.
run = [{ task = "devdb" }, { task = "generate" }, "go run ./cmd/dandori"]

[tasks.lint]
description = "Run golangci-lint (config in .golangci.yml)"
run = "golangci-lint run ./..."

[tasks."db:schema"]
description = "Print the schema of the database at DANDORI_DATABASE_URL (pg_dump must be as new as its Postgres)"
# pg_dump --schema leaves out the extensions the schema's tables use, and
# --extension fails when one isn't there yet, so psql lists them first.
run = [
  """psql -XAtc "SELECT format('CREATE EXTENSION %I WITH SCHEMA public;', extname) FROM pg_extension WHERE extnamespace = 'public'::regnamespace ORDER BY 1" "$DANDORI_DATABASE_URL"""",
  'pg_dump --schema-only --no-owner --no-privileges --schema=public "$DANDORI_DATABASE_URL"',
]
