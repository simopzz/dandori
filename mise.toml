[tools]
go = "1.27.3"
"go:github.com/a-h/templ/cmd/templ" = "0.3.1070"
golangci-lint = "2.15.0"

[env]
# Local secrets such as DANDORI_DATABASE_URL; see .env.example.
_.file = ".env"
# Admin connection to a disposable Postgres + pgvector server; seam-1 tests
# create one database per test on it. Start it with `mise run testdb`.
DANDORI_TEST_DATABASE_URL = "postgres://postgres:postgres@127.0.0.1:5433/postgres?sslmode=disable"

[tasks.generate]
description = "Generate Go code from templ templates"
run = "templ generate"

[tasks.build]
description = "Build the single dandori binary"
depends = ["generate"]
run = "go build -o bin/dandori ./cmd/dandori"

[tasks.test]
description = "Run the full test suite (needs the test database)"
depends = ["generate"]
run = "go test ./..."

[tasks.testdb]
description = "Start the disposable Postgres + pgvector test server (docker needs sudo)"
run = "sudo docker run -d --rm --name dandori-testdb -e POSTGRES_PASSWORD=postgres -p 127.0.0.1:5433:5432 pgvector/pgvector:pg17"

[tasks.check]
description = "Run every check CI runs: gofmt, go vet, golangci-lint and the full test suite"
depends = ["generate"]
run = [
  'unformatted=$(gofmt -l .); if [ -n "$unformatted" ]; then echo "gofmt needed:"; echo "$unformatted"; exit 1; fi',
  "go vet ./...",
  "golangci-lint run ./...",
  "go test ./...",
]

[tasks.dev]
description = "Run the app locally against DANDORI_DATABASE_URL"
depends = ["generate"]
run = "go run ./cmd/dandori serve"

[tasks.lint]
description = "Run golangci-lint (config in .golangci.yml)"
run = "golangci-lint run ./..."
