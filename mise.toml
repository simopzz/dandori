[tools]
go = "1.27.3"
"go:github.com/a-h/templ/cmd/templ" = "0.3.1070"
"go:golang.org/x/tools/cmd/deadcode" = "0.53.0"
golangci-lint = "2.15.0"

# mise install turns on the repo's git hooks: the pre-commit hook runs mise run guardrails.
[hooks]
postinstall = "git config core.hooksPath .githooks"

[env]
# Local secrets such as DANDORI_DATABASE_URL; see .env.example.
_.file = ".env"
# Admin connection to a disposable Postgres + pgvector server; seam-1 tests
# create one database per test on it. Start it with `mise run testdb`.
DANDORI_TEST_DATABASE_URL = "postgres://postgres:postgres@127.0.0.1:5433/postgres?sslmode=disable"

[tasks.generate]
description = "Generate Go code from templ templates"
run = "templ generate"

[tasks.build]
description = "Build the single dandori binary"
depends = ["generate"]
run = "go build -o bin/dandori ./cmd/dandori"

[tasks.test]
description = "Run the full test suite (needs the test database)"
depends = ["generate"]
run = "go test ./..."

[tasks.testdb]
description = "Start the disposable Postgres + pgvector test server afresh, replacing one already running (docker needs sudo)"
# Its data is thrown away, so it never waits for the disk: with fsync on, the seam-1
# tests running in parallel spend most of their time on commits. pg_isready over TCP, as
# devdb's: while the image initialises, its temporary server listens only on the socket.
run = '''
sudo docker rm -f dandori-testdb >/dev/null 2>&1 || true
sudo docker run -d --rm --name dandori-testdb -e POSTGRES_PASSWORD=postgres \
  -p 127.0.0.1:5433:5432 pgvector/pgvector:pg17 \
  -c fsync=off -c synchronous_commit=off -c full_page_writes=off >/dev/null
until sudo docker exec dandori-testdb pg_isready -q -h 127.0.0.1; do sleep 0.5; done
'''

[tasks.browsers]
description = "Install the Chromium the browser tests drive (CI adds --with-deps for its system libraries)"
run = "go run github.com/mxschmitt/playwright-go/cmd/playwright install chromium"

[tasks.check]
description = "Run every check CI runs: gofmt, go vet, golangci-lint and the full test suite"
depends = ["generate"]
run = [
  'unformatted=$(gofmt -l .); if [ -n "$unformatted" ]; then echo "gofmt needed:"; echo "$unformatted"; exit 1; fi',
  "go vet ./...",
  "golangci-lint run ./...",
  "go test -count=1 ./...",
]

[tasks.guardrails]
description = "Run the checks that need no database, in seconds: gofmt, templ output up to date, go vet, golangci-lint and the guardrail tests"
depends = ["generate"]
run = [
  'unformatted=$(gofmt -l .); if [ -n "$unformatted" ]; then echo "gofmt needed:"; echo "$unformatted"; exit 1; fi',
  'git diff --quiet -- "*_templ.go" || { echo "templ output changed: add the *_templ.go files"; git diff --stat -- "*_templ.go"; exit 1; }',
  "go vet ./...",
  "golangci-lint run ./...",
  "go test -count=1 ./internal/web ./internal/clock ./internal/kitchen ./cmd/dandori ./scripts/wrap",
]

[tasks.devdb]
description = "Start the local Postgres + pgvector dev server, which keeps its data between runs (docker needs sudo unless it is up)"
# pg_isready over TCP: while the image initialises its first database, its
# temporary server listens only on the socket. One already up needs no sudo.
run = '''
pg_isready -q -h 127.0.0.1 -p 5434 2>/dev/null && exit 0
sudo docker start dandori-devdb >/dev/null 2>&1 || sudo docker run -d --name dandori-devdb \
  -v dandori-devdb:/var/lib/postgresql/data -e POSTGRES_PASSWORD=postgres \
  -p 127.0.0.1:5434:5432 pgvector/pgvector:pg17 >/dev/null
until sudo docker exec dandori-devdb pg_isready -q -h 127.0.0.1; do sleep 0.5; done
'''

[tasks.dev]
description = "Run the app locally against the dev server and the real Supabase Auth. With DANDORI_DEV_NOW set, the app runs on a manual clock at that time, with a fake Supabase Auth, on a database of its own made afresh each start, unless DANDORI_DEV_USERS pins a User of the dev database."
# devdb first, alone: as dependencies the two would run in parallel, and
# generate's output would land on sudo's password prompt. The script sets the env.
run = [{ task = "devdb" }, { task = "generate" }, "scripts/dev.sh"]

[tasks.wrap]
description = "Rewrap the Go comments TestCommentsWrap fails, naming those that aren't plain prose"
run = "go run ./scripts/wrap"

[tasks.pr-image]
description = "Publish images for a PR on the pr-images branch and print their <img> tags: mise run pr-image <pr> <image>..."
run = "scripts/pr-image.sh"

[tasks.lint]
description = "Run golangci-lint (config in .golangci.yml)"
run = "golangci-lint run ./..."

[tasks."db:schema"]
description = "Print the schema of the database at DANDORI_DATABASE_URL (pg_dump must be as new as its Postgres)"
# pg_dump --schema leaves out the extensions the schema's tables use, and
# --extension fails when one isn't there yet, so psql lists them first.
run = [
  """psql -XAtc "SELECT format('CREATE EXTENSION %I WITH SCHEMA public;', extname) FROM pg_extension WHERE extnamespace = 'public'::regnamespace ORDER BY 1" "$DANDORI_DATABASE_URL"""",
  'pg_dump --schema-only --no-owner --no-privileges --schema=public "$DANDORI_DATABASE_URL"',
]

[tasks."graph:dashboard"]
description = "Serve the understand-anything dashboard for the graph in .ua (publish one with /graph, fetch one with .claude/skills/graph/sync.sh pull)"
# The viewer is the plugin's prebuilt release, pinned to the installed plugin so it reads the graph format that wrote .ua.
run = '''
[ -f .ua/knowledge-graph.json ] || { echo "no graph in .ua: run /graph in Claude Code" >&2; exit 1; }
v=$(ls ~/.claude/plugins/cache/understand-anything/understand-anything 2>/dev/null | sort -V | tail -1)
[ -n "$v" ] || { echo "the understand-anything plugin isn't installed" >&2; exit 1; }
npx --yes "https://github.com/Egonex-AI/Understand-Anything/releases/download/v$v/understand-anything-viewer.tgz" "$PWD"
'''
